<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title description">
  <title id="title">Nullish coalescing decision</title>
  <desc id="description">The fallback on the right side of the nullish coalescing operator is selected only for null or undefined.</desc>
  <rect width="900" height="330" rx="20" fill="#f0fdfa"/>
  <text x="450" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#134e4a">Nullish coalescing: value ?? fallback</text>
  <rect x="300" y="75" width="300" height="58" rx="12" fill="#fff" stroke="#5eead4" stroke-width="2"/>
  <text x="450" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#134e4a">Is value null or undefined?</text>
  <path d="M385 133 L250 185" fill="none" stroke="#0f766e" stroke-width="3"/>
  <path d="M515 133 L650 185" fill="none" stroke="#0f766e" stroke-width="3"/>
  <rect x="45" y="185" width="360" height="105" rx="14" fill="#fff" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="495" y="185" width="360" height="105" rx="14" fill="#fff" stroke="#2dd4bf" stroke-width="2"/>
  <text x="225" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">Yes: use the fallback</text>
  <text x="225" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">null ?? "default" → "default"</text>
  <text x="675" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f766e">No: keep the original value</text>
  <text x="675" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">0, false, and "" are preserved</text>
</svg>
